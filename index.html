<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkHub - Kumpulan Link WhatsApp</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #f6a800;
            color: #333;
        }

        /* =========================
           BACKGROUND UTAMA
        ========================= */

        .page {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;

            background:
                radial-gradient(circle at 20% 15%, rgba(255,255,255,0.20) 0 35px, transparent 36px),
                radial-gradient(circle at 85% 25%, rgba(255,255,255,0.15) 0 50px, transparent 51px),
                radial-gradient(circle at 15% 70%, rgba(255,255,255,0.13) 0 60px, transparent 61px),
                linear-gradient(135deg, #ffb300, #f28c00);
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;

            padding: 35px 18px 40px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================
           DEKORASI
        ========================= */

        .star {
            position: absolute;
            font-size: 30px;
            color: white;
            opacity: 0.9;
        }

        .star.one {
            top: 75px;
            right: calc(50% - 180px);
        }

        .star.two {
            top: 130px;
            left: calc(50% - 190px);
            font-size: 20px;
        }

        /* =========================
           FOTO / LOGO
        ========================= */

        .profile {
            width: 105px;
            height: 105px;

            border-radius: 50%;
            overflow: hidden;

            background: white;
            border: 4px solid rgba(255,255,255,0.9);

            box-shadow: 0 5px 20px rgba(0,0,0,0.18);

            margin-bottom: 15px;
        }

        .profile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Kalau gambar tidak tersedia */
        .profile-fallback {
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 42px;
            background: #ffffff;
        }

        /* =========================
           NAMA
        ========================= */

        .name {
            font-size: 25px;
            font-weight: 800;
            color: white;

            text-align: center;

            margin-bottom: 8px;

            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        /* =========================
           DESKRIPSI
        ========================= */

        .description {
            max-width: 400px;

            text-align: center;

            color: white;
            font-size: 14px;
            line-height: 1.6;

            margin-bottom: 25px;
        }

        /* =========================
           DAFTAR LINK
        ========================= */

        .links {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 14px;
        }

        /* =========================
           TOMBOL LINK
        ========================= */

        .link-card {
            width: 100%;
            min-height: 75px;

            display: flex;
            align-items: center;

            text-decoration: none;
            color: #333;

            background: rgba(255,255,255,0.94);

            border-radius: 18px;

            padding: 10px 14px;

            box-shadow:
                0 5px 12px rgba(0,0,0,0.12);

            transition: 0.25s ease;

            border: 2px solid rgba(255,255,255,0.5);
        }

        .link-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 18px rgba(0,0,0,0.18);

            background: white;
        }

        .link-card:active {
            transform: scale(0.98);
        }

        /* =========================
           GAMBAR GRUP
        ========================= */

        .group-image {
            width: 54px;
            height: 54px;

            min-width: 54px;

            border-radius: 50%;

            object-fit: cover;

            background: #eee;

            margin-right: 13px;

            border: 2px solid #ddd;
        }

        /* =========================
           ISI LINK
        ========================= */

        .link-content {
            flex: 1;
            text-align: left;
        }

        .link-title {
            font-size: 15px;
            font-weight: 800;

            margin-bottom: 4px;

            color: #333;
        }

        .link-description {
            font-size: 12px;

            line-height: 1.4;

            color: #777;
        }

        /* =========================
           ICON WHATSAPP
        ========================= */

        .wa-icon {
            width: 35px;
            height: 35px;

            min-width: 35px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #25D366;

            color: white;

            font-size: 18px;

            margin-left: 8px;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 30px;

            text-align: center;

            color: rgba(255,255,255,0.85);

            font-size: 12px;
        }

        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            .container {
                padding-top: 50px;
            }

            .link-card {
                min-height: 82px;
            }

            .link-title {
                font-size: 16px;
            }

            .link-description {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="container">

        <!-- DEKORASI -->
        <div class="star one">☆</div>
        <div class="star two">✦</div>


        <!-- =========================
             FOTO / LOGO
        ========================= -->

        <div class="profile">

            <!--
                GANTI logo.jpg dengan foto/logo kamu.

                Contoh:
                images/logo.jpg
            -->

            <img
                src="images/logo.jpg"
                alt="Logo LinkHub"
                onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'profile-fallback\'>🔗</div>';"
            >

        </div>


        <!-- =========================
             NAMA WEBSITE
        ========================= -->

        <h1 class="name">
            LINKHUB
        </h1>


        <!-- =========================
             DESKRIPSI
        ========================= -->

        <p class="description">
            silahkan dan nikmati
        </p>


        <!-- =========================
             SEMUA LINK WHATSAPP
        ========================= -->

        <div class="links" id="linksContainer">
        </div>


        <!-- =========================
             FOOTER
        ========================= -->

        <div class="footer">
            © 2026 LinkHub
        </div>

    </div>

</div>


<script>

    /*
    =====================================================
    DAFTAR GRUP WHATSAPP
    =====================================================

    KAMU CUKUP MENAMBAHKAN DATA DI BAGIAN INI.

    Tidak perlu mengubah bagian kode lainnya.

    =====================================================
    */

    const GRUP_WHATSAPP = [

        {
            nama: "Grup keluarga go go",

            keterangan:
                "Tempat para pelayer mcgg asik.",

            link:
                "https://chat.whatsapp.com/ESFJxRAQMjqLoGvfiVwxZe",

            gambar:
                "images/grup1.jpg"
        },


        {
            nama: "support kreator",

            keterangan:
                "link donate ada di sini.",

            link:
                "sociabuzz.com/ata01_/tribe",

            gambar:
                "images/grup2.jpg"
        },


        {
            nama: "Komunitas Muslim Indonesia",

            keterangan:
                "Berbagi ilmu, informasi dan kegiatan positif.",

            link:
                "https://chat.whatsapp.com/ZZZZZZZZZZZZ",

            gambar:
                "images/grup3.jpg"
        },


        {
            nama: "Grup Belajar Online",

            keterangan:
                "Belajar dan berdiskusi bersama.",

            link:
                "https://chat.whatsapp.com/AAAAAAAAAAAA",

            gambar:
                "images/grup1.jpg"
        }

    ];


    /*
    =====================================================
    MENAMPILKAN LINK
    =====================================================
    */

    const container =
        document.getElementById("linksContainer");


    GRUP_WHATSAPP.forEach(function(grup) {

        const link =
            document.createElement("a");

        link.className = "link-card";

        link.href = grup.link;

        link.target = "_blank";

        link.rel = "noopener noreferrer";


        /*
        Gambar grup
        */

        const gambar =
            document.createElement("img");

        gambar.className =
            "group-image";

        gambar.src =
            grup.gambar;

        gambar.alt =
            grup.nama;


        /*
        Kalau gambar tidak ditemukan,
        gunakan icon WhatsApp.
        */

        gambar.onerror = function() {

            this.src =
                "data:image/svg+xml;charset=UTF-8," +
                encodeURIComponent(`
                    <svg xmlns="http://www.w3.org/2000/svg"
                    width="100" height="100">
                        <rect width="100%" height="100%"
                        fill="#25D366"/>
                        <text x="50%" y="58%"
                        text-anchor="middle"
                        font-size="45">☘</text>
                    </svg>
                `);

        };


        /*
        Isi teks
        */

        const content =
            document.createElement("div");

        content.className =
            "link-content";


        const title =
            document.createElement("div");

        title.className =
            "link-title";

        title.textContent =
            grup.nama;


        const description =
            document.createElement("div");

        description.className =
            "link-description";

        description.textContent =
            grup.keterangan;


        content.appendChild(title);

        content.appendChild(description);


        /*
        Icon WhatsApp
        */

        const icon =
            document.createElement("div");

        icon.className =
            "wa-icon";

        icon.textContent =
            "➤";


        /*
        Masukkan semuanya
        */

        link.appendChild(gambar);

        link.appendChild(content);

        link.appendChild(icon);

        container.appendChild(link);

    });

</script>

</body>
</html>
